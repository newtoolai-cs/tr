<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>TikTok Ortak</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #00b140;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  .green-screen {
    width: 100%;
    height: 100vh;
    background: #00b140;
    position: relative;
  }

  .notification {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #fff;
    border-radius: 16px 16px 0 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px calc(32px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    animation: slideUp 0.55s cubic-bezier(0.32, 0.72, 0, 1) 0.8s forwards;
  }

  @keyframes slideUp {
    to { transform: translateY(0); }
  }

  .handle {
    width: 46px;
    height: 4px;
    background: #ccc;
    border-radius: 2px;
    margin: 12px auto 20px;
    flex-shrink: 0;
  }

  .felicidades {
    color: #000;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-align: center;
    margin-bottom: 16px;
  }

  .icon-wrap {
    position: relative;
    width: 88px;
    height: 88px;
    margin-bottom: 8px;
  }

  .icon-wrap img {
    width: 88px;
    height: 88px;
    object-fit: contain;
    border-radius: 12px;
  }

  .chain-badge {
    position: absolute;
    bottom: -2px;
    right: -6px;
    background: #f0f0f0;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #ddd;
  }

  .tiktok-wordmark {
    color: #000;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.01em;
    line-height: 1;
    margin-bottom: 10px;
  }

  .affiliate-line {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 14px;
  }
  .dash-cyan { width: 26px; height: 2px; background: #25f4ee; }
  .dash-pink { width: 26px; height: 2px; background: #fe2c55; }
  .affiliate-text {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.13em;
    color: #25f4ee;
    white-space: nowrap;
  }
  .affiliate-text .program { color: #fe2c55; }

  .selected-text {
    color: #000;
    font-size: 18px;
    font-weight: 800;
    text-align: center;
    margin-bottom: 18px;
  }

  .chevrons {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    animation: bounce 1.1s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(5px); }
  }

  .girl-img {
    width: 240px;
    height: auto;
    display: block;
    margin: 0 auto 16px;
    border-radius: 16px;
  }
</style>
</head>
<body>

<div class="green-screen"></div>

<div class="notification">
  <div class="handle"></div>

  <img class="girl-img" src="../tiktok_afiliado_image.png" alt="TikTok İçerik Üreticisi" />

  <div class="felicidades">TEBRİKLER!</div>

  <div class="tiktok-wordmark">TikTok</div>

  <div class="affiliate-line">
    <div class="dash-cyan"></div>
    <div class="affiliate-text">ORTAKLIK PAZARLAMA <span class="program">PROGRAMI</span></div>
    <div class="dash-pink"></div>
  </div>

  <div class="selected-text">Seçildiniz!</div>

  <div class="chevrons">
    <svg width="32" height="17" viewBox="0 0 32 17" fill="none">
      <polyline points="2,2 16,14 30,2" stroke="#888" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg width="32" height="17" viewBox="0 0 32 17" fill="none" style="opacity:0.45">
      <polyline points="2,2 16,14 30,2" stroke="#666" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
</div>

</body>
</html>
